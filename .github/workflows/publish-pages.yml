name: Publish portfolio to GitHub Pages
# GitHub Actions publishing source and custom-domain DNS confirmed by site owner.
# Publish only public/ after static checks; manual dispatch remains available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/publish-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
